{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block head %}

{% if object %}
    <h1>Event update</h1>
{% else %}
    <h1>Event anlegen</h1>
{% endif %}

{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6">
            
            <form method="post">
                {% csrf_token %}

                {{ form|crispy }}

                <button type="submit" class="btn btn-primary">
                    Event speichern
                </button>

                <a href="{% url 'events:event_list' %}" class="btn btn-secondary">
                    Abbrechen
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
